schema: factorio_local_workflow
schema_version: 1
mod_name: pollution-reclamation
canonical_agent_name: Pollution Reclamation Factorio Modding Agent
workspace_path: /home/jcherry/Documents/git/factorio-mods/pollution-reclamation
metadata_path: src/info.json
ownership_model: independent_continuation
upstream_or_fork_source: >
  Reconstructed from the released KrastorioAirPurifier 1.2.2 by Tarckmhog (mod portal listing,
  no public source repository or other contact channel found). KrastorioAirPurifier itself ports
  the air purifier from Krastorio 2 by raiguard, Krastor, and Linver. Continued independently
  under a new name and namespace because the original mod name is unavailable to publish under.
namespace_prefixes:
  - pr_
  - __pollution-reclamation__/
dependency_stack:
  - base >= 2.1.0
optional_dependencies:
  - space-age
incompatible_mods:
  - air-filtering
  - Krastorio2
scope_boundaries:
  - Owns the pollution condenser and pollution vaporizer buildings, the polluted water and solvent fluids, pollution filter items, the pollution filtering and filter restoration recipes, and the pollution technologies.
  - Keep this repository focused on capturing, relocating, and filtering pollution. Keep unrelated gameplay systems out unless Jason explicitly approves a scope expansion.
release_target: Factorio 2.1 mod releases. Space Age is optional, not required.
internal_gitflow_stage: full_gitflow
branch_roles:
  main: Release branch. Main validates on every push and publishes only when src/info.json version changes or public release recovery is needed.
  dev: Long-lived integration branch for completed feature work.
  feature: Short-lived feature/* branches created from dev and merged back to dev.
  release: Short-lived release/* branches created from dev and merged to main.
  hotfix: Short-lived hotfix/* branches created from main for urgent release-line fixes.
release_promotion_path: dev -> release/<version-or-purpose> -> main -> dev
feature_branching_enabled: true
release_branching_enabled: true
main_branch_protection:
  enabled: false
  notes: Not yet configured on the Gitea side; branch protection parity with the other family repos is still pending.
feature_branch_base_requirements:
  required_base: dev
  pre_pr_verification:
    - Fetch origin before opening a feature pull request.
    - Verify the feature branch merge-base is origin/dev, not another feature branch.
    - Verify the pull request base branch is dev.
  required_commands:
    - git fetch origin dev
    - test "$(git merge-base HEAD origin/dev)" = "$(git rev-parse origin/dev)"
    - confirm the pull request target/base branch is dev before creating or updating it.
hotfix_flow:
  enabled: true
  branch_pattern: hotfix/<version-or-topic>
  sync_requirements:
    - Merge or cherry-pick hotfix results back to dev after main receives the fix.
    - Evaluate any active release branch for the same fix before closing the hotfix.
post_release_main_to_dev_sync:
  required: true
  mechanism: Manual merge or fast-forward from main back into dev unless validated automation is added later.
  automation_validated: false
  failure_owner: Jason or the acting release agent.
ci_cd_release_gates:
  validation: Pull-request CI validates release branches into main; main push workflow validates main.
  packaging: Main push workflow packages only when release publication is enabled.
  publishing: Main push workflow publishes Gitea releases, GitHub releases, Factorio Mod Portal uploads, and Discord announcements on src/info.json version bumps, at parity with the sibling advanced-* mods; see docs/release-process.md.
  post_release_sync: Manual; no validated automation currently records main-to-dev sync.
changelog_process:
  format: Factorio mod portal changelog in src/changelog.txt.
  pending_notes_mechanism: Merge summary must state no player-visible release impact or name the intended changelog bullet/category until a dedicated pending-notes mechanism exists.
  top_version_must_match_metadata: true
validation_available:
  json: true
  lua_syntax: true
  lint: false
  format: false
  factorio_load: true
  factorio_headless_harness: true
  gui_runtime: false
local_testing:
  standard_approach: headless_harness
  summary: >
    Local testing of this mod runs Factorio headless, started from the command line with
    its own config and write-data directory. Anything the engine does not document is
    measured by a throwaway harness mod run that way, not inferred from the API docs,
    from existing code, or from what a value looks like it should be. Numbers quoted to
    Jason, to a pull request, or to the design docs come from a measured run.
  rationale: >
    Jason's standing rule on this repository's balance and behaviour questions is no
    hand-waving and no throwing numbers around. The harness is how that gets satisfied.
    It has already overturned stated assumptions here rather than confirming them: the
    Gleba spore exploit, the grouped-condenser leak, and the belief that Factorio 2.1
    needs a reset_technology_effects migration were each settled by measurement, and
    each came out against the assumption that prompted the run.
  baseline_before_measuring:
    - ./scripts/validate.sh with PR_REQUIRE_FACTORIO=1 -- JSON, Lua syntax, the
      src/control purity guard, the plain-Lua unit tests, and a Factorio load with
      Space Age present.
    - ./scripts/factorio-validate-base-game.sh -- the same load with Space Age absent.
    - Both are the standing gate. The harness is the step beyond them, for questions a
      load check cannot answer.
  binary:
    path: /home/jcherry/Games/steam/steamapps/common/Factorio/bin/x64_/factorio
    notes: >
      bin/x64/factorio is a Steam arch-dispatch wrapper around the same build. Both work
      headless.
  never_launch_graphically:
    enforced: true
    reason: >
      Headless mode skips the Steam API. A graphical launch initialises it and hands off
      with "Steam requires game restart", starting the game through Steam, which can
      disturb whatever Jason is running there. Both binaries do this; bin/x64_ is not an
      escape hatch. Observed 2026-09-19 while trying to exercise a mod GUI.
    instead: >
      Measure everything behind the interface headlessly, check prototype-side names
      against the installed game data, and say plainly which part was not verified.
  procedure:
    - Stage a throwaway harness mod in the session scratchpad, never inside src/ and
      never in Jason's own mods directory.
    - Point Factorio at a scratch config with its own write-data directory. Factorio
      takes an exclusive lock on it, so a run without this fails whenever Jason's game
      is open -- and a failed --dump-data leaves a stale file that reads as a real result.
    - Use --mod-directory pointing at a scratch directory that symlinks this repo's src/,
      so the harness loads the working tree rather than an installed copy.
    - Create the save with --create, then run it with --benchmark and --benchmark-ticks.
    - Emit findings through log() with a fixed prefix so they can be grepped out of the
      run log.
    - Use raise_built = true on create_entity, or this mod's own control.lua never
      registers the entity.
    - Sample repeatedly; an early reading is a warm-up wavefront, not equilibrium.
    - Delete the harness afterwards. It is a measuring instrument, not a test suite --
      invariants worth keeping go in tests/lua/ instead.
  limits:
    - No player exists in a headless run and there is no API to create one, so GUI code
      -- frames, player.opened, element events -- cannot be exercised locally at all.
      Verify everything behind the window on real entities, check style and sprite names
      against the installed game data, and state that the window itself needs an in-game
      look. Do not let a passing harness run imply the interface was checked.
    - A harness measures the behaviour it was pointed at. It does not establish that the
      surrounding feature is correct, and it is not a substitute for the unit tests.
  reporting:
    - Report what was measured, what the run actually printed, and what could not be
      tested this way. The kind policy already requires reporting what could not be
      load-tested; this makes the same obligation concrete for behaviour questions.
declared_deviations:
  - Post-release main-to-dev sync is manual until automation is implemented and validated.
  - Factorio Mod Portal listing for pollution-reclamation is not yet confirmed to exist. KrastorioAirPurifier is already taken on the portal by a different author, so this mod needs its own listing; the upload step in deploy.yml is wired and will run on the next version bump regardless, and will simply fail that one destination (Gitea and GitHub releases still succeed independently) if the listing is missing.
  - main branch protection is not yet enabled on Gitea for this repository, unlike advanced-fluid-infrastructure.
workspace_specific_rules:
  - Start ordinary implementation branches from dev as feature/<topic>.
  - Before opening or updating a feature pull request, verify the branch descends directly from origin/dev and the pull request base is dev.
  - Merge feature branches back to dev after review and validation.
  - Cut release branches from dev as release/<version-or-purpose>.
  - Merge release branches to main, then sync main back to dev before starting new ordinary feature work.
  - Do not open recurring dev-to-main pull requests.
  - Do not publish, tag, upload, or create release artifacts outside explicit release work.
  - Run Factorio headless for all local testing. Never start it graphically, and never
    through Steam.
  - Settle undocumented engine behaviour with a headless harness run before quoting a
    number or asserting a behaviour; see local_testing.
migration_notes:
  - On 2026-09-19 the headless harness was recorded as this repository's standard local
    testing approach, after a graphical launch attempt handed off to Steam mid-session.
    The practice predates the record -- it had already been used for the condenser gate
    and technology work -- but was carried in session memory rather than governance.
  - Full GitFlow, governance, CI, and release automation were instantiated on 2026-08-13 to bring this repository to parity with advanced-energy-grid, advanced-fluid-infrastructure, and advanced-power-infrastructure, at Jason's request.
  - Repository was previously an uncommitted reconstruction of the released KrastorioAirPurifier 1.2.2 mod with no CI, governance, or release automation.
  - Renamed from KrastorioAirPurifier to Pollution Reclamation (slug pollution-reclamation) because the original name is already published on the Factorio Mod Portal by a different author with no reachable contact channel.
  - Factorio Mod Portal upload and Discord release announcement steps were added to deploy.yml on 2026-08-13, bringing release automation to full parity with the sibling advanced-* mods, once the GitHub mirror repository and its access token existed. ci.yml's cross-mod family validation step (unique to advanced-fluid-infrastructure, which validates against advanced-energy-grid, advanced-power-infrastructure, and RampantArsenalFork) was deliberately not copied, since this mod has no declared dependency relationship with that family to validate.
  - On 2026-09-19 Jason approved the pollution economy as the mod's scope: the condenser and vaporizer (PR #12), and the air purifier building replaced by pipe-fed pollution filtering with solvent restoration (PR #13). scope_boundaries and workspace_path were updated to match; workspace_path previously pointed at the pre-rename k2-air-purifier-recycled directory.
last_stage_reviewed_at: 2026-08-13T00:00:00-07:00
known_gaps:
  - Post-release main-to-dev sync is manual until automation is implemented and validated.
  - Factorio Mod Portal listing existence is unconfirmed.
  - main branch protection is not yet enabled.
notes: This local workflow file is the repo-specific source of truth for GitFlow stage and branch roles.
