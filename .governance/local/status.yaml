notes: >
  Governance tree instantiated 2026-08-13, mirroring the canon at
  enforcement-redesign/factorio-modding-agent/main commit 52fea21c13f8953bf126284706bf4c3111d32a50
  as already adopted by advanced-fluid-infrastructure, advanced-power-infrastructure, and
