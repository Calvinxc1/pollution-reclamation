id: request_elicitation
status: ratified
scope: all_agents
summary: Request-triggered intake gate for confirming intent and material parameters before action.
bucket: B_outcome_plus_bounds
preferred_implementation:
  form: loadable_skill
  source: .governance/skills/request-elicitation/SKILL.md
outcome: Before acting on a request, the agent and Jason share an explicit goal statement and the material choices that would change the action.
trigger:
  fires_when: A user message carries an actual request to do something.
  does_not_fire_when: The message is pure conversation, idea bouncing, analysis without an action request, or a question that can be answered without taking action.
  hard_part: Detecting that a message is a request at all remains an implementation challenge; agents should err toward surfacing the gate when unsure.
rules:
  - When the gate fires, reflect the underlying goal back in one line and ask Jason to confirm, adjust, or refute it before acting.
  - Treat goal reflection as a confirmation or final-handoff device, not routine progress narration; after work has started, do not repeat "goal I am hearing" style framing in intermediate updates unless Jason explicitly asks for reconfirmation.
  - Run at least one confirmation pass even when there are no material questions.
  - Ask only the one to three questions whose answers would change what the agent does.
  - If no question would change the action, state that there are no material questions and ask for goal confirmation.
  - Before the first non-read-only action after request discussion, perform an explicit final action verification with Jason unless Jason's immediately preceding message is the approval of that verification.
  - Final action verification must name the intended actions, affected systems or files, expected risk tier, and validation plan.
  - If discussion, investigation, or planning materially changes the action scope after an earlier confirmation, run a new final action verification before acting.
  - Default to aggressive use per agent.
  - Tune the gate only downward over time for a request class when repeated interrogation of that class fails to change the resulting action.
  - Do not tune the gate upward without Jason.
  - The standing autonomous action classes are exempt: board moves, doc and status updates, and version control, each only inside the separate policy that already authorizes that autonomy.
  - If execution-control preflight is also required, combine the preflight with the elicitation confirmation when possible.
  - Do not ask for a second confirmation when the elicitation pass already states the goal, intended actions, affected systems or files, expected risk tier, validation plan, and Jason confirms it.
completion_evidence:
  - One-line goal reflection.
  - Either one to three material questions or an explicit statement that there are no material questions.
  - Jason's confirmation, adjustment, or refutation before action.
  - Final action verification immediately before non-read-only action, or a note that Jason's immediately preceding message approved that verification.
  - Preflight fields included when execution-control requires them.
