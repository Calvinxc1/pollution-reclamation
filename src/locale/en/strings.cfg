[mod-description]
pollution-reclamation=Adds a standalone air purification and pollution filtering system for Factorio 2.1. Originally ported from Krastorio 2 by Tarckmhog; continued as an independent mod by Jason M. Cherry. All credit for the original design and graphics goes to raiguard, Krastor, and Linver.

[mod-name]
pollution-reclamation=Pollution Reclamation

[technology-name]
pr_air-purification=Air quality monitoring
pr_improved-pollution-filter=Advanced pollution control
pr_pollution-economy=Pollution economy

[technology-description]
pr_air-purification=Provides access to a new filter system to capture pollutant particles released into the atmosphere. This will enable you to better control emissions from your Factory.
pr_improved-pollution-filter=Thanks to your technological advances, a new, more effective anti-pollution filter is now available!
pr_pollution-economy=Unlocks a pollution intake building to capture ambient pollution as a fluid, and a pollution outflow building to vent it elsewhere.

[entity-name]
pr_air-purifier=Air purifier
pr_pollution-intake=Pollution intake
pr_pollution-outflow=Pollution outflow

[entity-description]
pr_air-purifier=Building in charge of capturing the surrounding air in order to purify it.
pr_pollution-intake=Scrubs ambient pollution from the surrounding area and bottles it as captured pollution fluid. Only draws from air that is actually polluted.
pr_pollution-outflow=Vents captured pollution fluid back into the atmosphere at this location, relocating the biter aggression it attracts.

[item-name]
pr_pollution-filter=Anti-pollution filter
pr_improved-pollution-filter=Advanced anti-pollution filter
pr_used-pollution-filter=Used anti-pollution filter
pr_used-improved-pollution-filter=Used advanced anti-pollution filter
pr_pollution-intake=Pollution intake
pr_pollution-outflow=Pollution outflow

[item-description]

[fluid-name]
pr_captured-pollution=Captured pollution

[fluid-description]
pr_captured-pollution=Ambient pollution captured and bottled as a fluid. Store it, vent it elsewhere, or process it later.

[recipe-name]
pr_air-cleaning=Air filtering
pr_air-cleaning-2=Air filtering
pr_restore-used-pollution-filter=Anti-pollution filter cleaning
pr_restore-used-improved-pollution-filter=Advanced anti-pollution filter cleaning
pr_pollution-intake=Pollution intake
pr_pollution-outflow=Pollution outflow
pr_pollution-capture=Pollution capture
pr_pollution-venting=Pollution venting

[recipe-description]
pr_air-cleaning=Air filtering process to capture CO2 particles and limit the spread of pollution.
pr_air-cleaning-2=Air filtering process to capture CO2 particles and limit the spread of pollution. This process is made more efficient by taking advantage of the filter's more noble manufacturing materials.
pr_restore-used-pollution-filter=Cleaning the anti-pollution filter. Chances of getting coal as residue!
pr_restore-used-improved-pollution-filter=Advanced anti-pollution filter cleaning. Chances of getting coal and stone as residue!
pr_pollution-capture=Draws in ambient pollution and bottles it as captured pollution fluid. Only runs where there is real pollution to capture.
pr_pollution-venting=Releases captured pollution fluid back into the atmosphere, venting more pollution than the fluid represents.

[mod-setting-name]
pr_air-filtering-efficiency=Air purifier efficiency
pr_air-filtering-efficiency-spore=Air purifier efficiency for Gleba's spores

[mod-setting-description]
pr_air-filtering-efficiency=Adjust the efficiency of the filter building. This will not change the level of boost provided by the Advanced Filter.[color=red]\nIncreasing this value will make the building more efficient.[/color]
pr_air-filtering-efficiency-spore=Adjust the efficiency of the filter building for Gleba's spore. This will not change the level of boost provided by the Advanced Filter.[color=red]\nIncreasing this value will make the building more efficient.[/color]