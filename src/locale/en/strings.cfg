[mod-description]
pollution-reclamation=Adds a standalone air purification and pollution filtering system for Factorio 2.1. Originally ported from Krastorio 2 by Tarckmhog; continued as an independent mod by Jason M. Cherry. All credit for the original design and graphics goes to raiguard, Krastor, and Linver.

[mod-name]
pollution-reclamation=Pollution Reclamation

[technology-name]
pr_filter-restoration=Filter restoration
pr_air-purification=Air purification
pr_pollution-control=Pollution control

[technology-description]
pr_filter-restoration=Unlocks solvent, a mix of sulfuric acid and light oil, and a chemical plant process that uses it to restore used anti-pollution filters.
pr_air-purification=Unlocks anti-pollution filters and an air filtering process for Assembler 2 and 3 that traps the pollution in polluted water in a filter and releases the water. Used filters cannot be restored until Filter restoration.
pr_pollution-control=Unlocks a pollution condenser to capture ambient pollution as polluted water, and a pollution vaporizer to release it somewhere else.

[entity-name]
pr_pollution-condenser=Pollution condenser
pr_pollution-vaporizer=Pollution vaporizer

[entity-description]
pr_pollution-condenser=Scrubs ambient pollution from the surrounding area into water, producing polluted water. Only draws from air that is actually polluted.
pr_pollution-vaporizer=Evaporates polluted water into the atmosphere at this location, relocating the biter aggression it attracts.

[item-name]
pr_pollution-filter=Anti-pollution filter
pr_used-pollution-filter=Used anti-pollution filter
pr_pollution-condenser=Pollution condenser
pr_pollution-vaporizer=Pollution vaporizer

[item-description]

[fluid-name]
pr_solvent=Solvent
pr_polluted-water=Polluted water

[fluid-description]
pr_solvent=Sulfuric acid cut with light oil. The oil dissolves the tar and soot fouling a used filter so the acid can clean out the rest.
pr_polluted-water=Water used to scrub pollution out of the air. Store it, vent the pollution somewhere else, or filter it out.

[recipe-name]
pr_air-cleaning=Air filtering
pr_restore-used-pollution-filter=Anti-pollution filter restoration
pr_pollution-condenser=Pollution condenser
pr_pollution-vaporizer=Pollution vaporizer
pr_pollution-condensing=Pollution condensing
pr_pollution-vaporizing=Pollution vaporizing

[recipe-description]
pr_air-cleaning=Traps the pollution in polluted water in an anti-pollution filter and releases the water.
pr_restore-used-pollution-filter=Restores a used anti-pollution filter with solvent.
pr_pollution-condensing=Scrubs ambient pollution into water, producing polluted water.
pr_pollution-vaporizing=Evaporates polluted water into the atmosphere.
