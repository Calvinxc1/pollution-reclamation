[mod-description]
pollution-reclamation=Turns pollution into something you manage: condense it out of the air into polluted water, vaporize it somewhere else, or trap it in pollution filters. For Factorio 2.1. Originally ported from Krastorio 2 by Tarckmhog; continued as an independent mod by Jason M. Cherry. All credit for the original design and graphics goes to raiguard, Krastor, and Linver.

[mod-name]
pollution-reclamation=Pollution Reclamation

[technology-name]
pr_pollution-filter-restoration=Pollution filter restoration
pr_pollution-filtering=Pollution filtering
pr_pollution-control=Pollution control

[technology-description]
pr_pollution-filter-restoration=Unlocks solvent, a mix of sulfuric acid and light oil, and a chemical plant process that uses it to restore used pollution filters.
pr_pollution-filtering=Unlocks pollution filters and pollution filtering, which traps the pollution in polluted water in a filter and releases the water. Used filters cannot be restored until Pollution filter restoration.
pr_pollution-control=Unlocks a pollution condenser to capture ambient pollution as polluted water, and a pollution vaporizer to release it somewhere else.

[entity-name]
pr_pollution-condenser=Pollution condenser
pr_pollution-vaporizer=Pollution vaporizer

[entity-description]
pr_pollution-condenser=Scrubs ambient pollution from the surrounding area into water, producing polluted water. Only draws from air that is actually polluted.
pr_pollution-vaporizer=Evaporates polluted water into the atmosphere at this location, relocating the biter aggression it attracts.

[item-name]
pr_pollution-filter=Pollution filter
pr_used-pollution-filter=Used pollution filter
pr_pollution-condenser=Pollution condenser
pr_pollution-vaporizer=Pollution vaporizer

[item-description]

[fluid-name]
pr_solvent=Solvent
pr_polluted-water=Polluted water

[fluid-description]
pr_solvent=Sulfuric acid cut with light oil. The oil dissolves the tar and soot fouling a used filter so the acid can clean out the rest.
pr_polluted-water=Water used to scrub pollution out of the air. Store it, vent the pollution somewhere else, or filter it out.

